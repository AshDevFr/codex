# CI workflow for Pull Requests
# Runs tests, linting, frontend checks, and Docker build with PR tag

name: CI

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches:
      - main

# Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build test binaries and create nextest archive
  build-tests:
    name: Build Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: test
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build and archive tests
        run: cargo nextest archive --features rar --archive-file nextest-archive.tar.zst
      - name: Upload test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  # Run tests in parallel partitions
  test:
    name: Test (${{ matrix.partition }}/5)
    needs: build-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Run tests (partition ${{ matrix.partition }}/5)
        run: cargo nextest run --archive-file nextest-archive.tar.zst --partition hash:${{ matrix.partition }}/5

  # Run linting checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: lint
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy check
        run: cargo clippy --features rar -- -D warnings

  # Guard the API contract: the committed spec must match the code, and the
  # change must not break a client that generated against main.
  #
  # The freshness check is not optional decoration. `web/openapi.json` is a
  # committed artifact regenerated by a pre-commit hook, so a commit made with
  # `--no-verify`, or from a clone where `make setup-hooks` was never run,
  # leaves it stale. oasdiff would then compare two identical stale files, pass,
  # and let the breaking change through: the gate would be theatre.
  api-contract:
    name: API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: openapi
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Check the committed spec matches the code
        run: |
          cargo run -- openapi --output /tmp/openapi-fresh.json
          if ! diff -q /tmp/openapi-fresh.json web/openapi.json >/dev/null; then
            echo "::error::web/openapi.json is stale. Run 'make openapi-all' and commit the result."
            diff -u web/openapi.json /tmp/openapi-fresh.json | head -60 || true
            exit 1
          fi
          if ! diff -q web/openapi.json docs/api/openapi.json >/dev/null; then
            echo "::error::docs/api/openapi.json differs from web/openapi.json. Run 'make openapi'."
            exit 1
          fi
          echo "OpenAPI spec is in sync with the backend."

      - name: Fetch the base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      # Skipped when the PR is labelled `breaking-change`, so breaking the API
      # is a deliberate, visible act rather than a red check people learn to
      # ignore. The label is the record that it was intended.
      - name: Check for breaking API changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: origin/${{ github.base_ref }}:web/openapi.json
          revision: HEAD:web/openapi.json
          fail-on: ERR
          # The spec is public, but uploading it to a third party should be a
          # decision rather than a default.
          review: false

  # Run frontend tests and build
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint check
        working-directory: web
        run: npm run lint
      - name: Run tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd web && npm run test:run
      - name: Build frontend
        working-directory: web
        run: npm run build

  # Run plugin checks (lint, typecheck, tests)
  plugins:
    name: Plugins (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - sdk-typescript
          - metadata-echo
          - sync-echo
          - recommendations-echo
          - metadata-mangabaka
          - metadata-openlibrary
          - recommendations-anilist
          - recommendations-mangabaka
          - sync-anilist
          - release-mangaupdates
          - release-nyaa
          - release-tsundoku
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # SDK must be built first for other plugins to use
      - name: Build SDK (dependency)
        if: matrix.plugin != 'sdk-typescript'
        working-directory: plugins/sdk-typescript
        run: |
          npm ci
          npm run build
      - name: Install dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: npm ci
      - name: Lint
        working-directory: plugins/${{ matrix.plugin }}
        run: npm run lint
      - name: Typecheck
        working-directory: plugins/${{ matrix.plugin }}
        run: npx tsc --noEmit
      - name: Test
        working-directory: plugins/${{ matrix.plugin }}
        run: npm run test
      - name: Build
        working-directory: plugins/${{ matrix.plugin }}
        run: npm run build

  # Build and push Docker image with PR tag
  docker:
    name: Docker
    needs: [test, lint, frontend, plugins]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Determine build info
        id: info
        run: |
          echo "DOCKER_REGISTRY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-sha-
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cross
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.DOCKER_REGISTRY }}-buildcache:latest
          cache-to: type=registry,ref=ghcr.io/${{ env.DOCKER_REGISTRY }}-buildcache:latest,mode=max

  # Clean up intermediate artifacts
  cleanup:
    name: Cleanup
    needs:
      - test
      - docker
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete intermediate artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: nextest-archive
