# Cargo configuration for faster builds
# See: https://doc.rust-lang.org/cargo/reference/config.html
#
# Note: sccache is intentionally not wired in here. It's an optional local
# speed-up and committing `rustc-wrapper = "sccache"` would crash any CI
# job or Docker build that doesn't have sccache installed. Opt in locally
# via `export RUSTC_WRAPPER=sccache` (see docs/dev/contributing/development.md).

# =============================================================================
# Linker Configuration
# =============================================================================
# Using faster linkers significantly reduces link time during development.
# - Linux: mold (install with: apt install mold)
#
# If the linker is not installed, Cargo will fall back to the default linker.
#
# macOS uses the system linker. lld is not an option here: against the macOS 27
# SDK it fails to resolve libSystem primitives (bzero, memset, lchown, fchown),
# so every binary and test link dies with hundreds of undefined symbols. This is
# not a version lag that an upgrade clears, and Apple's ld is fast enough that
# the lost link time does not justify a broken build.
# =============================================================================

# Linux (x86_64) - used in CI
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Linux (ARM64)
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
