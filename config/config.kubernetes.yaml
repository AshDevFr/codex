# Minimal Kubernetes Configuration Example
#
# This config demonstrates using environment variables for sensitive data.
# In Kubernetes, set these via Secrets/ConfigMaps:
#
# Required Environment Variables:
#   CODEX_DATABASE__DB_TYPE=postgres
#   CODEX_DATABASE__POSTGRES__HOST=postgres-service
#   CODEX_DATABASE__POSTGRES__PORT=5432
#   CODEX_DATABASE__POSTGRES__USERNAME=<from secret>
#   CODEX_DATABASE__POSTGRES__PASSWORD=<from secret>
#   CODEX_DATABASE__POSTGRES__DATABASE_NAME=codex
#   CODEX_AUTH__JWT_SECRET=<from secret>
#
# Optional overrides:
#   CODEX_APPLICATION__HOST=0.0.0.0
#   CODEX_APPLICATION__PORT=8080
#   CODEX_API__ENABLE_API_DOCS=false
#   CODEX_LOGGING__LEVEL=info
#   CODEX_LOGGING__CONSOLE=true
#   CODEX_LOGGING__FILE=/var/log/codex/codex.log
#
# Startup-Time Settings (Require Pod Restart)
# ============================================
# These settings are in the config file and require a pod restart to change.
# Override via environment variables if needed:
#   CODEX_TASK__WORKER_COUNT=2
#   CODEX_SCANNER__MAX_CONCURRENT_SCANS=2
#   CODEX_SCHEDULER__TIMEZONE=UTC              # IANA timezone for cron jobs
#   CODEX_FILES__THUMBNAIL_DIR=data/thumbnails
#   CODEX_FILES__UPLOADS_DIR=data/uploads
#
# PDF Settings:
#   CODEX_PDF__PDFIUM_LIBRARY_PATH=/usr/lib/libpdfium.so
#   CODEX_PDF__RENDER_DPI=150
#   CODEX_PDF__JPEG_QUALITY=85
#   CODEX_PDF__CACHE_RENDERED_PAGES=true
#   CODEX_PDF__CACHE_DIR=data/cache
#
# Komga API (for third-party app compatibility):
#   CODEX_KOMGA_API__ENABLED=false
#   CODEX_KOMGA_API__PREFIX=komga
#
# OIDC / SSO Authentication:
#   CODEX_AUTH__OIDC__ENABLED=true
#   CODEX_AUTH__OIDC__AUTO_CREATE_USERS=true
#   CODEX_AUTH__OIDC__DEFAULT_ROLE=reader                           # admin, maintainer, reader
#   CODEX_AUTH__OIDC__REDIRECT_URI_BASE=https://codex.example.com  # Optional, defaults to http://{application.host}:{application.port}
#   # Per-provider settings (replace AUTHENTIK with your provider name):
#   CODEX_AUTH__OIDC__PROVIDERS__AUTHENTIK__DISPLAY_NAME=Authentik SSO
#   CODEX_AUTH__OIDC__PROVIDERS__AUTHENTIK__ISSUER_URL=https://authentik.example.com/application/o/codex/
#   CODEX_AUTH__OIDC__PROVIDERS__AUTHENTIK__CLIENT_ID=<from secret>
#   CODEX_AUTH__OIDC__PROVIDERS__AUTHENTIK__CLIENT_SECRET=<from secret>
#   CODEX_AUTH__OIDC__PROVIDERS__AUTHENTIK__SCOPES=profile,email
#   CODEX_AUTH__OIDC__PROVIDERS__AUTHENTIK__GROUPS_CLAIM=groups
#   CODEX_AUTH__OIDC__PROVIDERS__AUTHENTIK__USERNAME_CLAIM=preferred_username
#   CODEX_AUTH__OIDC__PROVIDERS__AUTHENTIK__EMAIL_CLAIM=email
#
# Rate Limiting:
#   CODEX_RATE_LIMIT__ENABLED=true
#   CODEX_RATE_LIMIT__ANONYMOUS_RPS=10
#   CODEX_RATE_LIMIT__ANONYMOUS_BURST=50
#   CODEX_RATE_LIMIT__AUTHENTICATED_RPS=50
#   CODEX_RATE_LIMIT__AUTHENTICATED_BURST=200
#   CODEX_RATE_LIMIT__EXEMPT_PATHS=/health,/api/v1/events
#   CODEX_RATE_LIMIT__CLEANUP_INTERVAL_SECS=60
#   CODEX_RATE_LIMIT__BUCKET_TTL_SECS=300

task:
  worker_count: 2 # Number of parallel task workers per pod

scanner:
  max_concurrent_scans: 2 # Max concurrent library scans

# Scheduler Settings (Startup-Time - Require Pod Restart)
# =======================================================
# scheduler:
#   timezone: UTC  # IANA timezone for cron jobs (override: CODEX_SCHEDULER__TIMEZONE)

files:
  thumbnail_dir: data/thumbnails # Thumbnail cache directory (persistent volume mount)
  uploads_dir: data/uploads # User uploads directory (persistent volume mount)

# Configuration Priority:
#   1. Environment Variables (highest - overrides config file)
#   2. Config File (this file)
#   3. Hardcoded Defaults (lowest)

# With all env vars set, you only need this minimal config:
# (or even an empty file - everything will use defaults + env vars)

# Uncomment to override defaults:
# application:
#   host: 0.0.0.0
#   port: 8080

# Uncomment to enable file logging:
# logging:
#   level: info
#   console: true
#   file: /var/log/codex/codex.log

# PDF Rendering Settings:
# pdf:
#   render_dpi: 150
#   jpeg_quality: 85
#   cache_rendered_pages: true
#   cache_dir: data/cache

# PDF Handle Cache (in-memory open-document cache):
# pdf_handle_cache:
#   enabled: true
#   capacity: 256              # Resident open handles (memory ~ capacity * 5-15 MB)
#   idle_ttl_minutes: 15
#   sweep_interval_seconds: 60

# Komga-Compatible API (for third-party apps):
# komga_api:
#   enabled: false
#   prefix: komga

# OIDC / SSO Authentication (disabled by default):
# auth:
#   oidc:
#     enabled: true
#     auto_create_users: true
#     default_role: reader
#     redirect_uri_base: "https://codex.example.com"  # Optional, defaults to http://{application.host}:{application.port}
#     providers:
#       authentik:
#         display_name: "Authentik SSO"
#         issuer_url: "https://authentik.example.com/application/o/codex/"
#         client_id: "codex-client-id"
#         client_secret_env: "OIDC_AUTHENTIK_SECRET"  # Read secret from K8s Secret env var
#         scopes:
#           - profile
#           - email
#         # Audiences accepted on API bearer tokens from this provider.
#         # Defaults to [client_id]. Add the client IDs of trusted apps that
#         # forward their users' IdP tokens to the Codex API.
#         # accepted_audiences:
#         #   - codex-client-id
#         #   - other-trusted-client-id
#         # role_mapping:
#         #   admin:
#         #     - codex-admins
#         #   reader:
#         #     - codex-users

# Rate Limiting (enabled by default):
# rate_limit:
#   enabled: true
#   anonymous_rps: 10
#   anonymous_burst: 50
#   authenticated_rps: 50
#   authenticated_burst: 200
#   exempt_paths:              # Glob patterns for paths exempt from rate limiting
#     - /health
#     - /api/v1/events
#     - /api/v1/events/**
#     - /api/v1/books/*/thumbnail   # Exempt book thumbnails
#   cleanup_interval_secs: 60
#   bucket_ttl_secs: 300

# OpenTelemetry observability (disabled by default).
#
# In Kubernetes you'll typically point this at the cluster's OTel collector
# DaemonSet/Deployment (e.g. opentelemetry-collector.observability.svc:4317)
# or at the OTLP receiver of an agent like the DataDog Agent. See
# docs/docs/observability.md for the schema, backend matrix, and sampling
# guidance.
#
# Most fields can also be set via env (CODEX_OBSERVABILITY_*) so secrets
# (auth tokens) can come from Kubernetes Secrets:
#   CODEX_OBSERVABILITY__ENABLED=true
#   CODEX_OBSERVABILITY__OTLP__ENDPOINT=http://otel-collector.observability:4317
#   CODEX_OBSERVABILITY__OTLP__HEADERS=signoz-access-token=$(cat /secrets/signoz-token)
# observability:
#   enabled: true
#   service_name: codex
#   otlp:
#     endpoint: http://otel-collector.observability:4317
#     protocol: grpc
#     # headers:                        # auth/tenant headers
#     #   x-honeycomb-team: ...
#     timeout_ms: 5000
#     # Optional HTTP override for the browser RUM proxy. Required when
#     # `endpoint` above is gRPC-only (e.g. Jaeger :4317); point at the
#     # collector's HTTP receiver (typically :4318). Falls back to
#     # `endpoint` when unset.
#     # proxy_endpoint: http://otel-collector.observability:4318
#   traces:
#     enabled: true
#     sample_ratio: 0.25                # tune for cluster traffic volume
#   metrics:
#     enabled: true
#     export_interval_ms: 30000
#   browser:
#     enabled: false
#     proxy_path: /api/v1/observability/otlp
#     sample_ratio: 0.1
